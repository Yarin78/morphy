  <text x="432.6" y="226" class="xs mut">what the user entered</text>
  <rect x="570.0" y="217" width="12" height="12" class="slotb" rx="2"/>
  <text x="588.0" y="226" class="xs mut">computed from the moves</text>
  <text x="24" y="272" class="xs mut">Numbers are big-endian. A guiding text has the same size and its own layout from 0x01 on.</text>
</svg>
