  <rect x="626" y="84" width="135" height="36" class="accb" rx="2"/>
  <text x="693.5" y="99" class="xs b acc" text-anchor="middle">black</text>
  <text x="693.5" y="113" class="xs m mut" text-anchor="middle">37</text>
  <rect x="764" y="84" width="43" height="36" class="accb" rx="2"/>
  <text x="785.5" y="104.0" class="xs fnt" text-anchor="middle">…</text>
  <rect x="74" y="124" width="89" height="36" class="accb" rx="2"/>
  <text x="118.5" y="139" class="xs b acc" text-anchor="middle">tournament</text>
  <text x="118.5" y="153" class="xs m mut" text-anchor="middle">51</text>
