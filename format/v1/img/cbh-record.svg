  <text x="164.5" y="179" class="xs b" text-anchor="middle">b. elo</text>
  <text x="164.5" y="193" class="xs m mut" text-anchor="middle">2832</text>
  <rect x="212" y="164" width="89" height="36" class="box" rx="2"/>
  <text x="256.5" y="179" class="xs b" text-anchor="middle">ECO</text>
  <text x="256.5" y="193" class="xs m mut" text-anchor="middle">B44</text>
  <rect x="304" y="164" width="89" height="36" class="box" rx="2"/>
  <text x="348.5" y="179" class="xs b" text-anchor="middle">medals</text>
  <text x="348.5" y="193" class="xs m mut" text-anchor="middle">0</text>
  <rect x="396" y="164" width="181" height="36" class="slotb" rx="2"/>
  <text x="486.5" y="179" class="xs b slotc" text-anchor="middle">flags</text>
  <text x="486.5" y="193" class="xs m mut" text-anchor="middle">0x0e</text>
  <rect x="580" y="164" width="89" height="36" class="slotb" rx="2"/>
  <text x="624.5" y="179" class="xs b slotc" text-anchor="middle">magn.</text>
  <text x="624.5" y="193" class="xs m mut" text-anchor="middle">13</text>
  <rect x="672" y="164" width="43" height="36" class="slotb" rx="2"/>
  <text x="693.5" y="179" class="xs b slotc" text-anchor="middle">moves</text>
  <text x="693.5" y="193" class="xs m mut" text-anchor="middle">51</text>
  <rect x="24" y="217" width="12" height="12" class="roseb" rx="2"/>
  <text x="42" y="226" class="xs mut">type</text>
  <rect x="87.6" y="217" width="12" height="12" class="keyb" rx="2"/>
  <text x="105.6" y="226" class="xs mut">where the moves and annotations are</text>
