  <text x="371.5" y="139" class="xs b acc" text-anchor="middle">source</text>
  <text x="371.5" y="153" class="xs m mut" text-anchor="middle">23</text>
  <rect x="442" y="124" width="135" height="36" class="box" rx="2"/>
  <text x="509.5" y="139" class="xs b" text-anchor="middle">date</text>
  <text x="509.5" y="153" class="xs m mut" text-anchor="middle">2018-11-28</text>
  <rect x="580" y="124" width="43" height="36" class="box" rx="2"/>
  <text x="601.5" y="139" class="xs b" text-anchor="middle">result</text>
  <text x="601.5" y="153" class="xs m mut" text-anchor="middle">1-0</text>
