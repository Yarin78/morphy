  <text x="647.5" y="139" class="xs b" text-anchor="middle">eval</text>
  <text x="647.5" y="153" class="xs m mut" text-anchor="middle">0</text>
  <rect x="672" y="124" width="43" height="36" class="box" rx="2"/>
  <text x="693.5" y="139" class="xs b" text-anchor="middle">round</text>
  <text x="693.5" y="153" class="xs m mut" text-anchor="middle">3</text>
  <rect x="718" y="124" width="43" height="36" class="box" rx="2"/>
  <text x="739.5" y="139" class="xs b" text-anchor="middle">sub</text>
  <text x="739.5" y="153" class="xs m mut" text-anchor="middle">0</text>
  <rect x="764" y="124" width="43" height="36" class="box" rx="2"/>
  <text x="785.5" y="139" class="xs b" text-anchor="middle">w. elo</text>
  <text x="785.5" y="153" class="xs m mut" text-anchor="middle">2835</text>
  <rect x="74" y="164" width="43" height="36" class="box" rx="2"/>
