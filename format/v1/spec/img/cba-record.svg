<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="An annotation record: a 14-byte header with the game id, the number of annotations plus one and the size, then the annotations, each with a position, a type, a size and its data.">
  <title>An annotation record: a 14-byte header with the game id, the number of annotations plus one and the size, then the annotations, each with a position, a type, a size and its data.</title>
  <style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size: 12px; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .sm { font-size: 11px; } .xs { font-size: 10px; } .lg { font-size: 13px; }
  .b { font-weight: 600; }
  .box, .wash, .accb, .keyb, .slotb, .roseb { stroke-width: 1.2; }
  .ln, .lnacc, .lndash { fill: none; stroke-width: 1.5; }
  .lndash { stroke-width: 1.2; stroke-dasharray: 4 4; }

  .bg { fill: #ffffff; stroke: #d3dad6; }
  text { fill: #16201c; }
  .mut { fill: #56625c; } .fnt { fill: #8a958f; }
  .acc { fill: #16805a; } .keyc { fill: #b07614; } .slotc { fill: #5b5fa8; }
  .rosec { fill: #a4405f; }
  .box { fill: #ffffff; stroke: #d3dad6; }
  .wash { fill: #eff2f0; stroke: #d3dad6; }
  .accb { fill: #ddefe6; stroke: #16805a; }
  .keyb { fill: #f6ead3; stroke: #b07614; }
  .slotb { fill: #e4e5f3; stroke: #5b5fa8; }
  .roseb { fill: #f6e2e8; stroke: #a4405f; }
  .ln, .lndash { stroke: #8a958f; }
  .lnacc { stroke: #16805a; }
  .hfnt { fill: #8a958f; } .hacc { fill: #16805a; }

  @media (prefers-color-scheme: dark) {

  .bg { fill: #17201d; stroke: #2c3833; }
  text { fill: #e2e8e5; }
  .mut { fill: #9daaa3; } .fnt { fill: #6f7c75; }
  .acc { fill: #2fa877; } .keyc { fill: #b98322; } .slotc { fill: #8c90d8; }
  .rosec { fill: #d4738f; }
  .box { fill: #17201d; stroke: #2c3833; }
  .wash { fill: #1d2824; stroke: #2c3833; }
  .accb { fill: #16362a; stroke: #2fa877; }
  .keyb { fill: #3a2d14; stroke: #b98322; }
  .slotb { fill: #262844; stroke: #8c90d8; }
  .roseb { fill: #3a1f28; stroke: #d4738f; }
  .ln, .lndash { stroke: #6f7c75; }
  .lnacc { stroke: #2fa877; }
  .hfnt { fill: #6f7c75; } .hacc { fill: #2fa877; }

  }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="299" rx="5"/>
  <text x="24" y="28" class="lg b">An annotation record</text>
  <text x="24" y="46" class="xs mut">found through the annotation offset of the game; a game with no annotations has none</text>
  <text x="24" y="66" class="xs fnt">shown: game 1038 of World-ch, 40 annotations in 3,146 bytes</text>
  <rect x="24" y="102" width="66" height="52" class="accb" rx="3"/>
  <text x="57.0" y="122" class="xs b acc" text-anchor="middle">game id</text>
  <text x="57.0" y="138" class="xs m mut" text-anchor="middle">1038</text>
  <text x="24" y="94" class="xs m fnt">0x00</text>
  <rect x="94" y="102" width="92" height="52" class="wash" rx="3"/>
  <text x="140.0" y="122" class="xs b mut" text-anchor="middle">fixed</text>
  <text x="140.0" y="138" class="xs m mut" text-anchor="middle">01 00 0e 0e</text>
  <text x="94" y="94" class="xs m fnt">0x03</text>
  <rect x="190" y="102" width="66" height="52" class="box" rx="3"/>
  <text x="223.0" y="122" class="xs b " text-anchor="middle">count + 1</text>
  <text x="223.0" y="138" class="xs m mut" text-anchor="middle">41</text>
  <text x="190" y="94" class="xs m fnt">0x07</text>
  <rect x="260" y="102" width="66" height="52" class="keyb" rx="3"/>
  <text x="293.0" y="122" class="xs b keyc" text-anchor="middle">size</text>
  <text x="293.0" y="138" class="xs m mut" text-anchor="middle">3146</text>
  <text x="260" y="94" class="xs m fnt">0x0a</text>
  <text x="334" y="94" class="xs m fnt">0x0e</text>
  <rect x="330" y="102" width="148" height="52" class="accb" rx="3"/>
  <text x="404.0" y="122" class="xs b acc" text-anchor="middle">position 9</text>
  <text x="404.0" y="138" class="xs mut" text-anchor="middle">text, 217 bytes</text>
  <rect x="482" y="102" width="148" height="52" class="accb" rx="3"/>
  <text x="556.0" y="122" class="xs b acc" text-anchor="middle">position 22</text>
  <text x="556.0" y="138" class="xs mut" text-anchor="middle">symbols, 7 bytes</text>
  <rect x="634" y="102" width="148" height="52" class="accb" rx="3"/>
  <text x="708.0" y="122" class="xs b acc" text-anchor="middle">position 22</text>
  <text x="708.0" y="138" class="xs mut" text-anchor="middle">text, 98 bytes</text>
  <text x="792" y="132" class="lg fnt">…</text>
  <text x="24" y="196" class="sm b">Each annotation</text>
  <rect x="24" y="210" width="116" height="52" class="accb" rx="3"/>
  <text x="82.0" y="230" class="sm b acc" text-anchor="middle">position</text>
  <text x="82.0" y="246" class="xs mut" text-anchor="middle">3 bytes</text>
  <text x="82.0" y="278" class="xs fnt" text-anchor="middle">−1 is the game</text>
  <rect x="144" y="210" width="116" height="52" class="keyb" rx="3"/>
  <text x="202.0" y="230" class="sm b keyc" text-anchor="middle">type</text>
  <text x="202.0" y="246" class="xs mut" text-anchor="middle">1 byte</text>
  <text x="202.0" y="278" class="xs fnt" text-anchor="middle">02 text, 03 symbols …</text>
  <rect x="264" y="210" width="116" height="52" class="box" rx="3"/>
  <text x="322.0" y="230" class="sm b " text-anchor="middle">size</text>
  <text x="322.0" y="246" class="xs mut" text-anchor="middle">2 bytes</text>
  <text x="322.0" y="278" class="xs fnt" text-anchor="middle">counts these 6</text>
  <rect x="384" y="210" width="246" height="52" class="slotb" rx="3"/>
  <text x="507.0" y="230" class="sm b slotc" text-anchor="middle">data</text>
  <text x="507.0" y="246" class="xs mut" text-anchor="middle">size − 6 bytes</text>
  <text x="507.0" y="278" class="xs fnt" text-anchor="middle">depends on the type</text>
</svg>
