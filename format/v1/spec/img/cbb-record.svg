<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 384" width="860" height="384" role="img" aria-label="A map of the 52-byte record of the search booster .cbb: three unused bytes, the pawn count and the piece counts, then one byte per rank for each kind of piece, with a bit for every file the piece has stood on.">
