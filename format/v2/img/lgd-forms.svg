<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="The three forms a game list takes, all three from record 11576 of Mega 2026: a single pair of games for the player, a range for the tournament, and a chain of blocks for the team.">
  <title>The three forms a game list takes, all three from record 11576 of Mega 2026: a single pair of games for the player, a range for the tournament, and a chain of blocks for the team.</title>
  <style>
