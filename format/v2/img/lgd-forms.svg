  <path d="M642 255 L660 255" class="lnacc" marker-end="url(#c)"/>
  <text x="668" y="259" class="sm">three blocks: 30 + 30 + 12</text>
  <text x="24" y="316" class="xs mut">The top bits of first choose the form. A list is in ascending order, an entity referred to twice is listed twice, and deleted games stay in it.</text>
