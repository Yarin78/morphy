<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 268" width="860" height="268" role="img" aria-label="Finding node 145915: 145915 divided by 102 is node page 1430, remainder 55. The catalog gives directory page 1867, whose entry 1 is page 1868, whose entry 406 is page 2459, where slot 55 holds the node.">
  <title>Finding node 145915: 145915 divided by 102 is node page 1430, remainder 55. The catalog gives directory page 1867, whose entry 1 is page 1868, whose entry 406 is page 2459, where slot 55 holds the node.</title>
  <style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size: 12px; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .sm { font-size: 11px; } .xs { font-size: 10px; } .lg { font-size: 13px; }
  .b { font-weight: 600; }
  .box, .wash, .accb, .keyb, .slotb, .roseb { stroke-width: 1.2; }
  .ln, .lnacc, .lndash { fill: none; stroke-width: 1.5; }
  .lndash { stroke-width: 1.2; stroke-dasharray: 4 4; }

  .bg { fill: #ffffff; stroke: #d3dad6; }
  text { fill: #16201c; }
  .mut { fill: #56625c; } .fnt { fill: #8a958f; }
  .acc { fill: #16805a; } .keyc { fill: #b07614; } .slotc { fill: #5b5fa8; }
  .rosec { fill: #a4405f; }
  .box { fill: #ffffff; stroke: #d3dad6; }
  .wash { fill: #eff2f0; stroke: #d3dad6; }
  .accb { fill: #ddefe6; stroke: #16805a; }
  .keyb { fill: #f6ead3; stroke: #b07614; }
  .slotb { fill: #e4e5f3; stroke: #5b5fa8; }
  .roseb { fill: #f6e2e8; stroke: #a4405f; }
  .ln, .lndash { stroke: #8a958f; }
  .lnacc { stroke: #16805a; }
  .hfnt { fill: #8a958f; } .hacc { fill: #16805a; }

  @media (prefers-color-scheme: dark) {

  .bg { fill: #17201d; stroke: #2c3833; }
  text { fill: #e2e8e5; }
  .mut { fill: #9daaa3; } .fnt { fill: #6f7c75; }
  .acc { fill: #2fa877; } .keyc { fill: #b98322; } .slotc { fill: #8c90d8; }
  .rosec { fill: #d4738f; }
  .box { fill: #17201d; stroke: #2c3833; }
  .wash { fill: #1d2824; stroke: #2c3833; }
  .accb { fill: #16362a; stroke: #2fa877; }
  .keyb { fill: #3a2d14; stroke: #b98322; }
  .slotb { fill: #262844; stroke: #8c90d8; }
  .roseb { fill: #3a1f28; stroke: #d4738f; }
  .ln, .lndash { stroke: #6f7c75; }
  .lnacc { stroke: #2fa877; }
  .hfnt { fill: #6f7c75; } .hacc { fill: #2fa877; }

  }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="267" rx="5"/>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hacc"/></marker>
  <text x="24" y="28" class="lg b">Finding a node when the index has a directory</text>
  <text x="24" y="46" class="xs mut">Magnus Carlsen is player 145915 in Mega 2026, an index of depth 2</text>
  <text x="24" y="70" class="sm m b">145915 ÷ 102 = node page 1430, remainder 55</text>
  <text x="24" y="88" class="xs mut">1430 = 1 × 1024 + 406, so each directory level peels off one base-1024 digit</text>
  <rect x="24" y="110" width="188" height="96" class="keyb" rx="5"/>
  <text x="118" y="134" class="sm b" text-anchor="middle">catalog entry</text>
  <text x="118" y="150" class="xs mut" text-anchor="middle">Default Spieler</text>
  <text x="118" y="176" class="sm m" text-anchor="middle">depth 2</text>
  <text x="118" y="194" class="sm m b" text-anchor="middle">page 1867</text>
  <rect x="232" y="110" width="188" height="96" class="slotb" rx="5"/>
  <text x="326" y="134" class="sm b" text-anchor="middle">page 1867</text>
  <text x="326" y="150" class="xs mut" text-anchor="middle">top directory</text>
  <text x="326" y="176" class="sm m" text-anchor="middle">entry 1</text>
  <text x="326" y="194" class="sm m b" text-anchor="middle">→ page 1868</text>
  <rect x="440" y="110" width="188" height="96" class="slotb" rx="5"/>
  <text x="534" y="134" class="sm b" text-anchor="middle">page 1868</text>
  <text x="534" y="150" class="xs mut" text-anchor="middle">directory</text>
  <text x="534" y="176" class="sm m" text-anchor="middle">entry 406</text>
  <text x="534" y="194" class="sm m b" text-anchor="middle">→ page 2459</text>
  <rect x="648" y="110" width="188" height="96" class="accb" rx="5"/>
  <text x="742" y="134" class="sm b" text-anchor="middle">page 2459</text>
  <text x="742" y="150" class="xs mut" text-anchor="middle">node page</text>
  <text x="742" y="176" class="sm m" text-anchor="middle">slot 55</text>
  <text x="742" y="194" class="sm m b" text-anchor="middle">→ the node</text>
  <path d="M212 158 L228 158" class="lnacc" marker-end="url(#b)"/>
  <path d="M420 158 L436 158" class="lnacc" marker-end="url(#b)"/>
  <path d="M628 158 L644 158" class="lnacc" marker-end="url(#b)"/>
  <text x="24" y="230" class="xs mut">An entry of 0 means no id in that range belongs to the index, and such holes may come before pages that exist.</text>
  <text x="24" y="250" class="xs mut">Depth follows from the highest id, not the number of entities: up to 102 → depth 0, up to 104,448 → depth 1, beyond that → depth 2.</text>
</svg>
