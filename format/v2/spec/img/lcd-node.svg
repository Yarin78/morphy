<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 216" width="860" height="216" role="img" aria-label="A node is 40 bytes: left child, right child and parent as 8-byte entity ids, an 8-byte key, a 2-byte balance, 2 unused bytes and the 4-byte slot number. The values shown are the node of Magnus Carlsen in Mega 2026.">
  <title>A node is 40 bytes: left child, right child and parent as 8-byte entity ids, an 8-byte key, a 2-byte balance, 2 unused bytes and the 4-byte slot number. The values shown are the node of Magnus Carlsen in Mega 2026.</title>
  <style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size: 12px; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .sm { font-size: 11px; } .xs { font-size: 10px; } .lg { font-size: 13px; }
  .b { font-weight: 600; }
  .box, .wash, .accb, .keyb, .slotb, .roseb { stroke-width: 1.2; }
  .ln, .lnacc, .lndash { fill: none; stroke-width: 1.5; }
  .lndash { stroke-width: 1.2; stroke-dasharray: 4 4; }

  .bg { fill: #ffffff; stroke: #d3dad6; }
  text { fill: #16201c; }
  .mut { fill: #56625c; } .fnt { fill: #8a958f; }
  .acc { fill: #16805a; } .keyc { fill: #b07614; } .slotc { fill: #5b5fa8; }
  .rosec { fill: #a4405f; }
  .box { fill: #ffffff; stroke: #d3dad6; }
  .wash { fill: #eff2f0; stroke: #d3dad6; }
  .accb { fill: #ddefe6; stroke: #16805a; }
  .keyb { fill: #f6ead3; stroke: #b07614; }
  .slotb { fill: #e4e5f3; stroke: #5b5fa8; }
  .roseb { fill: #f6e2e8; stroke: #a4405f; }
  .ln, .lndash { stroke: #8a958f; }
  .lnacc { stroke: #16805a; }
  .hfnt { fill: #8a958f; } .hacc { fill: #16805a; }

  @media (prefers-color-scheme: dark) {

  .bg { fill: #17201d; stroke: #2c3833; }
  text { fill: #e2e8e5; }
  .mut { fill: #9daaa3; } .fnt { fill: #6f7c75; }
  .acc { fill: #2fa877; } .keyc { fill: #b98322; } .slotc { fill: #8c90d8; }
  .rosec { fill: #d4738f; }
  .box { fill: #17201d; stroke: #2c3833; }
  .wash { fill: #1d2824; stroke: #2c3833; }
  .accb { fill: #16362a; stroke: #2fa877; }
  .keyb { fill: #3a2d14; stroke: #b98322; }
  .slotb { fill: #262844; stroke: #8c90d8; }
  .roseb { fill: #3a1f28; stroke: #d4738f; }
  .ln, .lndash { stroke: #6f7c75; }
  .lnacc { stroke: #2fa877; }
  .hfnt { fill: #6f7c75; } .hacc { fill: #2fa877; }

  }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="215" rx="5"/>
  <text x="24" y="28" class="lg b">A node — 40 bytes, little-endian</text>
  <text x="24" y="46" class="xs mut">node 145915 of the player index is player 145915, Magnus Carlsen</text>
  <rect x="24" y="86" width="159.4" height="46" class="accb" rx="3"/>
  <text x="103.7" y="113.0" class="sm acc" text-anchor="middle">left child</text>
  <text x="24" y="78" class="xs m fnt">0x00</text>
  <text x="103.7" y="150" class="sm m b mut" text-anchor="middle">167742</text>
  <rect x="186.4" y="86" width="159.4" height="46" class="accb" rx="3"/>
  <text x="266.1" y="113.0" class="sm acc" text-anchor="middle">right child</text>
  <text x="186.4" y="78" class="xs m fnt">0x08</text>
  <text x="266.1" y="150" class="sm m b mut" text-anchor="middle">−1</text>
  <rect x="348.8" y="86" width="159.4" height="46" class="accb" rx="3"/>
  <text x="428.5" y="113.0" class="sm acc" text-anchor="middle">parent</text>
  <text x="348.8" y="78" class="xs m fnt">0x10</text>
  <text x="428.5" y="150" class="sm m b mut" text-anchor="middle">158691</text>
  <rect x="511.20000000000005" y="86" width="159.4" height="46" class="keyb" rx="3"/>
  <text x="590.9000000000001" y="113.0" class="sm keyc" text-anchor="middle">key</text>
  <text x="511.20000000000005" y="78" class="xs m fnt">0x18</text>
  <text x="590.9000000000001" y="150" class="sm m b mut" text-anchor="middle">“carlsen”</text>
  <rect x="673.6" y="86" width="37.6" height="46" class="wash" rx="3"/>
  <text x="692.4" y="113.0" class="sm mut" text-anchor="middle">bal</text>
  <text x="673.6" y="78" class="xs m fnt">0x20</text>
  <text x="692.4" y="150" class="sm m b mut" text-anchor="middle">−1</text>
  <rect x="714.2" y="86" width="37.6" height="46" class="wash" rx="3"/>
  <text x="733.0" y="113.0" class="sm mut" text-anchor="middle">—</text>
  <text x="714.2" y="78" class="xs m fnt">0x22</text>
  <text x="733.0" y="150" class="sm m b mut" text-anchor="middle">0</text>
  <rect x="754.8000000000001" y="86" width="78.2" height="46" class="slotb" rx="3"/>
  <text x="793.9000000000001" y="113.0" class="sm slotc" text-anchor="middle">slot</text>
  <text x="754.8000000000001" y="78" class="xs m fnt">0x24</text>
  <text x="793.9000000000001" y="150" class="sm m b mut" text-anchor="middle">55</text>
  <text x="24" y="180" class="xs acc">entity ids, −1 where there is no such node</text>
  <text x="511.20000000000005" y="180" class="xs keyc">the first 8 bytes</text>
  <text x="511.20000000000005" y="194" class="xs keyc">of the sort fields</text>
  <text x="673.6" y="180" class="xs mut">right height</text>
  <text x="673.6" y="194" class="xs mut">minus left</text>
  <text x="836" y="180" class="xs slotc" text-anchor="end">id mod 102, or −1</text>
  <text x="836" y="194" class="xs slotc" text-anchor="end">on some leaves</text>
</svg>
