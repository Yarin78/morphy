  .accb { fill: #16362a; stroke: #2fa877; }
  .keyb { fill: #3a2d14; stroke: #b98322; }
  .slotb { fill: #262844; stroke: #8c90d8; }
  .roseb { fill: #3a1f28; stroke: #d4738f; }
  .ln, .lndash { stroke: #6f7c75; }
  .lnacc { stroke: #2fa877; }
  .hfnt { fill: #6f7c75; } .hacc { fill: #2fa877; }

  }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="559" rx="5"/>
  <text x="24" y="28" class="lg b">The game record — 192 bytes, 16 to a row</text>
  <text x="24" y="46" class="xs mut">every game has one, at 192 · game id; ids start at 1 and records are never removed</text>
  <text x="24" y="70" class="xs fnt">Mega Database 2026: 11,990,472 records, 2.3 GB</text>
  <text x="64" y="116.0" class="xs m fnt" text-anchor="end">0x00</text>
  <text x="64" y="148.0" class="xs m fnt" text-anchor="end">0x10</text>
