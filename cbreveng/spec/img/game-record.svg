<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-label="A map of the 192-byte game record: eight bytes of common header, two file offsets, seven entity ids, the details of the game, and the values ChessBase computes from the moves.">
  <title>A map of the 192-byte game record: eight bytes of common header, two file offsets, seven entity ids, the details of the game, and the values ChessBase computes from the moves.</title>
  <style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size: 12px; }
  .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .sm { font-size: 11px; } .xs { font-size: 10px; } .lg { font-size: 13px; }
  .b { font-weight: 600; }
  .box, .wash, .accb, .keyb, .slotb, .roseb { stroke-width: 1.2; }
  .ln, .lnacc, .lndash { fill: none; stroke-width: 1.5; }
  .lndash { stroke-width: 1.2; stroke-dasharray: 4 4; }

  .bg { fill: #ffffff; stroke: #d3dad6; }
  text { fill: #16201c; }
  .mut { fill: #56625c; } .fnt { fill: #8a958f; }
