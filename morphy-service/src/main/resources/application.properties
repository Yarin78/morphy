# Server Configuration
server.port=8080
# Application Name
spring.application.name=morphy-service
# Database Configuration
# Path to databases.json configuration file (relative to project root)
# If empty, an in-memory database config will be used (initially empty)
app.databases.config=test-databases/databases.json
# How often to check if database files have been modified externally (in milliseconds)
app.databases.freshness-check-interval=600000
# Comma-separated list of paths where databases can be registered (includes subdirectories)
# If empty, all paths are allowed (not recommended for production)
app.databases.allowed-paths=
# Comma-separated list of paths where new databases can be created (exact directories only, no subdirectories)
# If empty, all paths are allowed (not recommended for production)
app.databases.allowed-create-paths=
# Path to position-indexes.json, the definitions of the position indexes (relative to project root);
# position-indexes.local.json next to it is read too. A missing file defines none
app.position-indexes.config=test-databases/position-indexes.json
